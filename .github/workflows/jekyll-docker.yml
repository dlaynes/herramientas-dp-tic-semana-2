name: CI para portal web de Tareas Pendientes

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Prueba inicial
      run: echo "Hola mundo"
    - name: Mostrar fecha de ejecucion
      run: date
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - name: Build
      run: |
        npm ci
        npm run lint
        npm run build
        npm run test:run
