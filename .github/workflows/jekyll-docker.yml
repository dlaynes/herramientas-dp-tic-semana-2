name: Jekyll site CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Prueba inicial
      run: echo "Hola mundo"
    - name: Build
      run: |
        npm i
        npm run lint
        npm run build
        npm run test
